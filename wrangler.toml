# =============================================================
# VKU Field Survey — Cloudflare Configuration
# =============================================================
name = "vku-field-survey"
compatibility_date = "2024-09-23"

# Cloudflare Pages build output
pages_build_output_dir = "./dist"

# =============================================================
# Cloudflare D1 Database binding
# =============================================================
[[d1_databases]]
binding = "DB"
database_name = "vku-survey-db-v2"
database_id = "178e99b7-7773-4fb4-a819-0f27ab16f7f0"



# =============================================================
# (Optional) Cloudflare KV for session/cache storage
# Run to create:  wrangler kv namespace create SURVEY_KV
# =============================================================
# [[kv_namespaces]]
# binding = "SURVEY_KV"
# id = "<YOUR_KV_NAMESPACE_ID>"
